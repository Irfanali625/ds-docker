services:
  mongo:
    image: mongo:4.4
    container_name: ds-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ./mongodb:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_DB_PASSWORD}
    networks:
      - ds-network-prod

  seaweedfs:
    image: chrislusf/seaweedfs
    container_name: ds-seaweedfs
    command: >
      server
      -dir=/data
      -ip=seaweedfs
      -ip.bind=0.0.0.0
      -filer
      -s3
      -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json
    restart: unless-stopped
    ports:
      - "9333:9333"
      - "8080:8080"
      - "8888:8888"
      - "8333:8333"
    volumes:
      - ./seaweedfs-data/data:/data
      - ./seaweedfs-data/s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      - ds-network-prod

  seaweedfs-admin:
    image: chrislusf/seaweedfs
    container_name: ds-seaweedfs-admin
    restart: unless-stopped
    command: >
      admin
      -ip=0.0.0.0
      -port=8334
      -master=seaweedfs:9333
      -dataDir=/data
      -adminUser=${SEAWEEDFS_ADMIN_USER:-admin}
      -adminPassword=${SEAWEEDFS_ADMIN_PASSWORD:-seaweedfs}
    ports:
      - "8334:8334"   # SeaweedFS Admin Web UI
    volumes:
      - ./seaweedfs-data/admin:/data
    depends_on:
      - seaweedfs
    networks:
      - ds-network-prod

  backend:
    build:
      context: ./ds-backend
      dockerfile: Dockerfile
    container_name: ds-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./ds-backend/.env
    volumes:
      - ./ds-backend/uploads:/app/uploads
    depends_on:
      - mongo
      - seaweedfs
    networks:
      - ds-network-prod

  frontend:
    build:
      context: ./ds-frontend
      dockerfile: Dockerfile
    container_name: ds-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./ds-frontend/.env
    depends_on:
      - backend
    networks:
      - ds-network-prod

volumes:
  mongodb_data:
    driver: local

networks:
  ds-network-prod:
    driver: bridge
