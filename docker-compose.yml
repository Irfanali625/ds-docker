services:
  mongo:
    image: mongo
    container_name: vnc-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ./mongodb:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_DB_PASSWORD}
    networks:
      - vnc-network

  seaweedfs:
    image: chrislusf/seaweedfs
    container_name: vnc-seaweedfs
    # weed server starts master + volume + filer + S3 gateway in one process
    command: >
      server
      -dir=/data
      -ip=seaweedfs
      -ip.bind=0.0.0.0
      -filer
      -s3
      -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json
    restart: unless-stopped
    ports:
      - "9333:9333"   # Master HTTP
      - "8080:8080"   # Volume HTTP
      - "8888:8888"   # Filer HTTP / built-in file browser
      - "8333:8333"   # S3-compatible API
    volumes:
      - ./seaweedfs-data/data:/data
      - ./seaweedfs-data/s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      - vnc-network

  seaweedfs-admin:
    image: chrislusf/seaweedfs
    container_name: vnc-seaweedfs-admin
    restart: unless-stopped
    command: >
      admin
      -ip=0.0.0.0
      -port=8334
      -master=seaweedfs:9333
      -dataDir=/data
      -adminUser=${SEAWEEDFS_ADMIN_USER:-admin}
      -adminPassword=${SEAWEEDFS_ADMIN_PASSWORD:-seaweedfs}
    ports:
      - "8334:8334"   # SeaweedFS Admin Web UI
    volumes:
      - ./seaweedfs-data/admin:/data
    depends_on:
      - seaweedfs
    networks:
      - vnc-network

  backend:
    build:
      context: ./code/backend
      dockerfile: Dockerfile
    container_name: vnc-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      # container hostnames instead of the localhost values in .env
      MONGODB_URI: mongodb://${MONGO_DB_USERNAME}:${MONGO_DB_PASSWORD}@mongo:27017/data-scraping?authSource=admin
      SEAWEEDFS_ENDPOINT: seaweedfs
    volumes:
      - ./code/backend/uploads:/app/uploads
      - ./code/backend/src/services/json:/app/src/services/json:ro
    depends_on:
      - mongo
      - seaweedfs
    networks:
      - vnc-network

  frontend:
    build:
      context: ./code/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_MINIO_BUCKET: ${NEXT_PUBLIC_MINIO_BUCKET}
    container_name: vnc-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    environment:
      PORT: 3000  # .env PORT is the backend's
    depends_on:
      - backend
    networks:
      - vnc-network

networks:
  vnc-network:
    driver: bridge
