# Copy to /etc/nginx/conf.d/ and vnc_proxy.conf to /etc/nginx/ (see README)
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Frontend
server {
    listen 80;
    server_name validnumbercheck.app www.validnumbercheck.app;
    location / { proxy_pass http://127.0.0.1:3000; include /etc/nginx/vnc_proxy.conf; }
}

# Backend API
server {
    listen 80;
    server_name api.validnumbercheck.app;
    client_max_body_size 100m;
    location / { proxy_pass http://127.0.0.1:8000; include /etc/nginx/vnc_proxy.conf; }
}

# SeaweedFS admin UI
server {
    listen 80;
    server_name storage.validnumbercheck.app;
    client_max_body_size 100m;
    location / { proxy_pass http://127.0.0.1:8334; include /etc/nginx/vnc_proxy.conf; }
}
